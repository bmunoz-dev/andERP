# Servicios locales de desarrollo. Las credenciales son solo para esta máquina.
name: anderp

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: anderp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_RUNTIME_PASSWORD: app_runtime
      TZ: America/Bogota
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/anderp/bootstrap.sql:ro
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d anderp']
      interval: 5s
      timeout: 3s
      retries: 10

  # F17: almacenamiento S3 local (en producción, Supabase Storage). No valida las llaves.
  s3mock:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: contract-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - s3mock-data:/s3mockroot

  # SMTP de pruebas: captura todos los correos. Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  s3mock-data:
