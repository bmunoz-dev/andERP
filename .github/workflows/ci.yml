name: CI

# En `main` lo ejecuta deploy.yml antes de desplegar (F07 CA-13).
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de pnpm del campo `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (de terceros: fijada por SHA, F22 CA-8)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      # Las pruebas de integración levantan Postgres con Testcontainers (Docker del runner).
      - run: pnpm test

      # F22 CA-4: el esquema de Drizzle y las migraciones no se separan. `generate` no se conecta.
      - name: Esquema sincronizado con las migraciones
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain apps/api/drizzle)" || {
            git status --porcelain apps/api/drizzle
            echo "El esquema de Drizzle tiene cambios sin migración: corre pnpm db:generate" >&2
            exit 1
          }
        env:
          DATABASE_URL_MIGRATIONS: postgres://unused@localhost/unused

      # F22 CA-7: lo que se despliega compila, y la imagen de la API se construye.
      - run: pnpm build

      - name: Imagen Docker de la API
        run: docker build -f apps/api/Dockerfile -t anderp-api:ci .
